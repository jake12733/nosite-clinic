<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홈페이지 제작 문의 | Owen Web</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;background:#f4f6fa;color:#0f172a;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:520px;background:#fff;border:1px solid #e4e8ef;border-radius:18px;box-shadow:0 20px 50px rgba(15,23,42,.08);overflow:hidden}
.hd{background:#0b131f;color:#fff;padding:26px 26px 22px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#d4af37,#8a6d1c);display:grid;place-items:center;color:#0b131f;font-weight:900;margin-bottom:14px}
.hd h1{font-size:21px;line-height:1.4;word-break:keep-all}
.hd h1 span{color:#e6c35a}
.hd p{color:#a7b3c6;font-size:13.5px;margin-top:6px;line-height:1.6}
form{padding:22px 26px 26px;display:grid;gap:14px}
label{font-size:12.5px;font-weight:700;color:#475569;display:block;margin-bottom:6px}
input,textarea{width:100%;font:inherit;font-size:15px;border:1px solid #d5dbe5;border-radius:10px;padding:12px 13px;outline:none;background:#fff;color:#0f172a}
input:focus,textarea:focus{border-color:#d4af37;box-shadow:0 0 0 3px rgba(212,175,55,.2)}
textarea{min-height:120px;resize:vertical;line-height:1.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips button{font:inherit;font-size:12.5px;border:1px solid #d5dbe5;background:#f8fafc;border-radius:999px;padding:6px 11px;cursor:pointer;color:#334155}
.chips button:hover{border-color:#d4af37;color:#a8841b}
.hp{position:absolute;left:-9999px}
button.sub{height:50px;border:0;border-radius:12px;background:#0b131f;color:#fff;font:inherit;font-size:15.5px;font-weight:800;cursor:pointer}
button.sub:disabled{opacity:.6;cursor:default}
.note{font-size:11.5px;color:#94a3b8;line-height:1.6;text-align:center}
.err{color:#e5484d;font-size:13px;text-align:center;min-height:18px}
.done{padding:50px 26px 46px;text-align:center;display:none}
.done .ok{width:64px;height:64px;border-radius:50%;background:#e6f6ec;color:#12a150;display:grid;place-items:center;margin:0 auto 16px;font-size:30px;font-weight:900}
.done h2{font-size:20px;margin-bottom:8px}
.done p{color:#64748b;font-size:14px;line-height:1.7}
@media (max-width:480px){.row{grid-template-columns:1fr}.hd,form{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>
<div class="card">
  <div class="hd">
    <div class="logo">O</div>
    <h1><span id="hn">원장님</span>, 홈페이지 관련해서<br>편하게 남겨주세요</h1>
    <p>남겨주신 내용은 바로 담당자에게 전달돼요. 확인 후 빠르게 연락드릴게요.</p>
  </div>
  <form id="f" autocomplete="on">
    <div><label for="hname">병원명</label><input id="hname" name="hname" maxlength="100" placeholder="예: OO의원"></div>
    <div class="row">
      <div><label for="sender">성함 / 직책</label><input id="sender" name="sender" maxlength="60" placeholder="예: 김OO 원장"></div>
      <div><label for="contact">연락받을 번호·이메일</label><input id="contact" name="contact" maxlength="120" placeholder="010-0000-0000" inputmode="text"></div>
    </div>
    <div>
      <label for="message">문의 내용</label>
      <div class="chips" id="chips"><button type="button">가격이 궁금해요</button><button type="button">시안 수정 요청드려요</button><button type="button">전화 상담 원해요</button><button type="button">진행 기간이 궁금해요</button></div>
      <textarea id="message" name="message" maxlength="2000" placeholder="궁금하신 점이나 원하시는 내용을 적어주세요" required></textarea>
    </div>
    <input class="hp" name="website" tabindex="-1" autocomplete="off">
    <div class="err" id="err"></div>
    <button class="sub" id="btn" type="submit">문의 보내기</button>
    <p class="note">입력하신 정보는 문의 답변에만 사용돼요.<br>Owen Web · 웹 개발자 윤태현</p>
  </form>
  <div class="done" id="done"><div class="ok">✓</div><h2>문의가 전달됐어요</h2><p>확인하는 대로 남겨주신 연락처로<br>빠르게 연락드리겠습니다. 감사합니다!</p></div>
</div>
<script>
(() => {
  const FN = 'https://crrsswrrdpzmdlrgkfoi.supabase.co/functions/v1/nosite-inbox';
  const P = new URLSearchParams(location.search);
  const hkey = P.get('h') || '', n = P.get('n') || '', src = P.get('s') || '문의 페이지';
  const $ = id => document.getElementById(id);
  if (n) { $('hname').value = n; $('hn').textContent = n + ' 원장님'; document.title = n + ' · 홈페이지 제작 문의'; }
  $('chips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const t = $('message'); t.value = (t.value ? t.value.trim() + '\n' : '') + b.textContent; t.focus(); });
  $('f').addEventListener('submit', async e => {
    e.preventDefault(); $('err').textContent = '';
    const d = Object.fromEntries(new FormData(e.target).entries());
    if (!d.message || d.message.trim().length < 2) { $('err').textContent = '문의 내용을 적어주세요'; return; }
    $('btn').disabled = true; $('btn').textContent = '보내는 중...';
    try {
      const r = await fetch(FN, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'submit', hkey, hname: d.hname, sender: d.sender, contact: d.contact, message: d.message, website: d.website, source: src, page: location.href }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || '전송 실패');
      $('f').style.display = 'none'; $('done').style.display = 'block';
    } catch (err) { $('err').textContent = err.message + ' · 잠시 후 다시 시도해 주세요'; $('btn').disabled = false; $('btn').textContent = '문의 보내기'; }
  });
})();
</script>
</body>
</html>
